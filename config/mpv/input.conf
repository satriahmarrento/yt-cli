# MPV Keybindings for Terminal Audio/Video Playback

# Track Navigation (Playlist / Radio)
> playlist-next
< playlist-prev
. playlist-next
, playlist-prev
n playlist-next
p playlist-prev
ENTER playlist-next

# Playback Control
SPACE cycle pause
k cycle pause

# Volume
9 add volume -2
0 add volume 2
- add volume -2
+ add volume 2
= add volume 2
DOWN add volume -2
UP add volume 2
m cycle mute

# Seeking
RIGHT seek 5
LEFT seek -5
l seek 5
h seek -5
L seek 60
H seek -60

# Quit
q quit
Q quit-watch-later
