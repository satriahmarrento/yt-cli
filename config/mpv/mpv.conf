# MPV Optimized Audio/Video Streaming Config
vo=gpu-next
hwdec=auto-safe
volume=50

# Fast Caching & Readahead
cache=yes
demuxer-max-bytes=100MiB
demuxer-readahead-secs=60
network-timeout=15

# Persistent Connection for Faster Streaming
# Do NOT add reconnect_streamed=1 here. HLS audio is split into separate ~5s
# segments; reconnect_streamed treats each segment's clean EOF as a dropped
# stream, reconnects at every boundary, and keeps mpv's cache nearly empty
# (constant buffering). reconnect=1 still recovers real network failures.
demuxer-lavf-o=http_persistent=1,reconnect=1,reconnect_delay_max=5
msg-level=ffmpeg/demuxer=error,ffmpeg/tls=error

# Subtitles & Resume
sub-auto=fuzzy
save-position-on-quit=yes
