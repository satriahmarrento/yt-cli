# MPV Optimized Audio/Video Streaming Config
vo=gpu-next
hwdec=auto-safe

# Fast Caching & Readahead
cache=yes
demuxer-max-bytes=100MiB
demuxer-readahead-secs=60
network-timeout=15

# Persistent Connection for Faster Streaming
demuxer-lavf-o=http_persistent=1,reconnect=1,reconnect_streamed=1,reconnect_delay_max=5
msg-level=ffmpeg/demuxer=error,ffmpeg/tls=error

# Subtitles & Resume
sub-auto=fuzzy
save-position-on-quit=yes
